<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="כספית">
  <title>כספית</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA8E0"/>
      <stop offset="1" stop-color="#1E6FA8"/>
    </linearGradient>
    <linearGradient id="noteA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBF7"/>
    </linearGradient>
    <linearGradient id="coinG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFD981"/>
      <stop offset="1" stop-color="#E3A32B"/>
    </linearGradient>
  </defs>

  <!-- רקע -->
  <rect width="128" height="128" rx="28" fill="url(#sky)"/>

  <!-- אלמנט ההלוואה: חץ מעגלי שמסמל כסף שיוצא וחוזר -->
  <path d="M28 64a36 36 0 0 1 60-26.8" fill="none" stroke="#BFE2F7" stroke-width="5"
        stroke-linecap="round" opacity=".75"/>
  <path d="M100 64a36 36 0 0 1-60 26.8" fill="none" stroke="#BFE2F7" stroke-width="5"
        stroke-linecap="round" opacity=".75"/>
  <path d="M88 37.2l1.5-11.4 10.2 6.6z" fill="#BFE2F7" opacity=".95"/>
  <path d="M40 90.8l-1.5 11.4-10.2-6.6z" fill="#BFE2F7" opacity=".95"/>

  <!-- שטר אחורי -->
  <rect x="34" y="44" width="56" height="30" rx="4" fill="#C9E3F5" opacity=".85"
        transform="rotate(-8 62 59)"/>
  <!-- שטר קדמי -->
  <g transform="rotate(4 64 62)">
    <rect x="31" y="47" width="60" height="32" rx="4" fill="url(#noteA)"/>
    <rect x="35" y="51" width="52" height="24" rx="2" fill="none" stroke="#9CC6E4" stroke-width="1.4"/>
    <circle cx="61" cy="63" r="8" fill="none" stroke="#5B9FD0" stroke-width="2"/>
    <!-- שקל בתוך השטר -->
    <path d="M57 59v8h3.4c1.9 0 3.1-1.1 3.1-2.9V59" fill="none" stroke="#1E6FA8"
          stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M65.6 67v-8h-3.4c-1.9 0-3.1 1.1-3.1 2.9" fill="none" stroke="#1E6FA8"
          stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
          transform="translate(0,0) scale(1,-1) translate(0,-126)"/>
    <rect x="38" y="54" width="7" height="4" rx="1" fill="#9CC6E4"/>
    <rect x="77" y="68" width="7" height="4" rx="1" fill="#9CC6E4"/>
  </g>

  <!-- מטבעות -->
  <g>
    <ellipse cx="44" cy="96" rx="15" ry="5.4" fill="#C98E22"/>
    <rect x="29" y="88" width="30" height="8" fill="#E0A42C"/>
    <ellipse cx="44" cy="88" rx="15" ry="5.4" fill="url(#coinG)"/>
    <ellipse cx="44" cy="88" rx="9.5" ry="3.3" fill="none" stroke="#C98E22" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="86" cy="100" rx="13" ry="4.8" fill="#C98E22"/>
    <rect x="73" y="93" width="26" height="7" fill="#E0A42C"/>
    <ellipse cx="86" cy="93" rx="13" ry="4.8" fill="url(#coinG)"/>
    <ellipse cx="86" cy="93" rx="8" ry="2.9" fill="none" stroke="#C98E22" stroke-width="1.1"/>
  </g>
</svg>
